<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion, getDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // -------------------------------------------------------------
    // ⚠️ CONFIGURACIÓN FIREBASE ⚠️
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyAVTxYarB7cZzrZcm2ns5DaDsRgf2VaDpA",
      authDomain: "ampa-test-fff41.firebaseapp.com",
      projectId: "ampa-test-fff41",
      storageBucket: "ampa-test-fff41.firebasestorage.app",
      messagingSenderId: "966954997542",
      appId: "1:966954997542:web:0db03a4a88d14ac96453e7"
    };

    let app, db, matchRef, configRef, auth;
    
    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        matchRef = doc(db, "partidos", "semana_actual");
        configRef = doc(db, "config", "admin_settings"); 
    } catch (e) { console.error("Error init firebase", e); }

    const initialPlayers = [
        { id: "willi", name: "Willi", level: 3.2 },
        { id: "jhon", name: "Jhon", level: 3.0 },
        { id: "santi", name: "Santi", level: 3.1 },
        { id: "ivan", name: "Ivan", level: 3.0 },
        { id: "gus", name: "Gus", level: 3.4 },
        { id: "fabian", name: "Fabián", level: 3.1 },
        { id: "arturo", name: "Arturo", level: 3.1 },
        { id: "abraham", name: "Abraham", level: 2.5 },
        { id: "ivan_n", name: "Iván N", level: 2.8 },
        { id: "adrian", name: "Adrián", level: 2.5 },
        { id: "gabriel", name: "Gabriel", level: 2.5 },
        { id: "yusto", name: "Yusto", level: 2.2 },
        { id: "jose", name: "José", level: 2.8 },
        { id: "tono", name: "Toño", level: 2.2 },
        { id: "rafa", name: "Rafa", level: 2.0 },
        { id: "edu", name: "Edu", level: 2.1 },
        { id: "jesus_s", name: "Jesús S", level: 1.1 },
        { id: "norvey", name: "Norvey", level: 1.6 },
        { id: "richard", name: "Richard", level: 1.7 },
        { id: "ruben", name: "Rubén", level: 1.2 },
        { id: "eloy", name: "Eloy", level: 1.0 },
        { id: "luis", name: "Luis", level: 1.0 },
        { id: "alfredo", name: "Alfredo", level: 1.0 }
    ];

    const guestsDB = [
        { id: "guest_1", name: "Invitado 1", level: 1.5 }, 
        { id: "guest_2", name: "Invitado 2", level: 1.5 }, 
        { id: "guest_3", name: "Invitado 3", level: 1.5 }, 
        { id: "guest_4", name: "Invitado 4", level: 1.5 }, 
        { id: "guest_5", name: "Invitado 5", level: 1.5 }
    ];

    let currentData = { 
        matchDate: null, lockTime: "18:00", 
        pinMode: true, voteMode: true,
        selectedPlayers: [], selectedGuests: [], guestInviters: {}, 
        bannedIndices: [], teams: null, logs: [], pins: {}, unlockVotes: [],
        scores: [0,0,0], timerState: 'stopped', timerEnd: 0, timerLeft: 300,
        roster: []
    };
    
    let timerInterval = null;
    let hasBeeped = false;

    // --- HELPER: SHUFFLE (Global) ---
    window.shuffle = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };
    
    window.resetIdentity = () => {
        showConfirm("¿Cambiar de Usuario?", "¿Seguro que no eres tú? Se borrará tu identidad de este dispositivo.", () => {
            localStorage.removeItem('futsal_my_id');
            window.location.reload();
        });
    };
    
    window.downloadLineup = () => {
        const teams = window.currentTeamsForCopy;
        if (!teams || teams.length === 0) return window.showToast("No hay equipos para generar imagen", "error");

        window.showToast("Generando imagen...", "info");

        if(currentData.matchDate) {
            const dateObj = new Date(currentData.matchDate);
            const dateStr = dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
            document.getElementById('lc-date').innerText = dateStr;
        }
        
        const grid = document.getElementById('lc-grid');
        grid.innerHTML = '';
        const names = ['BLANCO', 'NEGRO', 'ROJO'];
        const classes = ['lc-white', 'lc-black', 'lc-red'];
        
        teams.forEach((team, i) => {
            let html = `<div class="lc-col ${classes[i]}"><div class="lc-team-title">${names[i]}</div>`;
            team.forEach(p => {
                const cleanName = p.name.replace(/<[^>]*>/g, ''); 
                html += `<div class="lc-player">${cleanName}</div>`;
            });
            html += `</div>`;
            grid.innerHTML += html;
        });

        const element = document.querySelector(".lineup-card");
        html2canvas(element, { backgroundColor: null, scale: 2 }).then(canvas => {
            canvas.toBlob(blob => {
                const file = new File([blob], `Alineacion_${new Date().toISOString().split('T')[0]}.png`, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({
                        files: [file],
                        title: 'Alineación AMPA',
                        text: 'Aquí tenéis los equipos confirmados.'
                    }).catch(err => console.log("Compartir cancelado o error", err));
                } else {
                    const link = document.createElement('a');
                    link.download = file.name;
                    link.href = canvas.toDataURL();
                    link.click();
                    window.showToast("Imagen descargada", "success");
                }
            }, 'image/png');
        }).catch(err => {
            console.error(err);
            window.showToast("Error al generar imagen", "error");
        });
    };

    // --- AUTHENTICATION STATE ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('admin-zone').style.display = 'block';
            window.showToast("Modo Admin Activo", "success");
        } else {
            document.getElementById('admin-zone').style.display = 'none';
        }
    });

    // --- UTILS UX ---
    window.showToast = (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function showConfirm(title, text, onConfirm, showInput = false) {
        const modal = document.getElementById('modal-overlay');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;
        const input = document.getElementById('modal-input');
        
        document.getElementById('stats-content').style.display = 'none';
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('modal-text').style.display = 'block';
        
        if(showInput) { input.style.display = 'block'; input.value = ''; input.focus(); } else input.style.display = 'none';
        const actions = document.getElementById('modal-actions');
        actions.innerHTML = '';
        const btnCancel = document.createElement('button'); btnCancel.className = 'modal-btn cancel'; btnCancel.innerText = 'Cancelar'; btnCancel.onclick = () => { modal.style.display = 'none'; };
        const btnConfirm = document.createElement('button'); btnConfirm.className = 'modal-btn confirm'; btnConfirm.innerText = 'Confirmar'; btnConfirm.onclick = () => { const val = input.value; modal.style.display = 'none'; onConfirm(val); };
        actions.appendChild(btnCancel); actions.appendChild(btnConfirm);
        modal.style.display = 'flex';
    }

    // --- LOGIN MODAL ---
    window.showLoginModal = () => {
        const modal = document.getElementById('modal-overlay');
        document.getElementById('modal-title').innerText = "Acceso Admin Seguro";
        document.getElementById('modal-text').style.display = 'none';
        document.getElementById('modal-input').style.display = 'none';
        document.getElementById('stats-content').style.display = 'none';
        
        const form = document.getElementById('login-form');
        form.style.display = 'flex';
        document.getElementById('login-email').value = '';
        document.getElementById('login-pass').value = '';

        const actions = document.getElementById('modal-actions');
        actions.innerHTML = '';
        const btnCancel = document.createElement('button'); btnCancel.className = 'modal-btn cancel'; btnCancel.innerText = 'Cancelar'; btnCancel.onclick = () => { modal.style.display = 'none'; };
        const btnLogin = document.createElement('button'); btnLogin.className = 'modal-btn confirm'; btnLogin.innerText = 'Entrar'; 
        btnLogin.onclick = () => { 
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => { 
                    modal.style.display = 'none'; 
                    document.getElementById('admin-zone').style.display = 'block'; 
                })
                .catch((e) => { window.showToast("Error de acceso: " + e.message, "error"); });
        };
        actions.appendChild(btnCancel); actions.appendChild(btnLogin);
        modal.style.display = 'flex';
    }

    window.logoutAdmin = () => {
        signOut(auth).then(() => window.showToast("Sesión cerrada", "info"));
    };

    // --- INICIALIZACIÓN ---
    document.getElementById('date-input').valueAsDate = new Date();

    onSnapshot(matchRef, (docSnap) => {
        document.getElementById('loader').style.display = 'none';
        if (docSnap.exists()) {
            currentData = docSnap.data();
            if (!currentData.roster || currentData.roster.length === 0 || !currentData.roster[0].id) {
                updateDoc(matchRef, { roster: initialPlayers });
            }
            updateUI(currentData);
        } else {
            setDoc(matchRef, { 
                matchDate: null, lockTime: "18:00", pinMode: true, voteMode: true,
                selectedPlayers: [], selectedGuests: [], guestInviters: {}, bannedIndices: [],
                teams: null, logs: [], pins: {}, unlockVotes: [], scores:[0,0,0], 
                timerState: 'stopped', timerLeft: 300, roster: initialPlayers 
            });
        }
    });

    function updateUI(data) {
        const activeRoster = [...(data.roster || initialPlayers)].sort((a, b) => a.name.localeCompare(b.name));
        
        // --- IDENTITY SELECTOR (v4.11): Ocultar si baneado ---
        const selector = document.getElementById('identity-select');
        if(selector.options.length <= 1) {
             activeRoster.forEach(p => {
                const isBanned = data.bannedIndices && data.bannedIndices.includes(p.id);
                if (!isBanned) {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.innerText = p.name;
                    selector.appendChild(opt);
                }
            });
        }

        const container = document.getElementById('player-container');
        const guestContainer = document.getElementById('guest-container');
        container.innerHTML = ''; guestContainer.innerHTML = '';

        // Render Admin Lists
        const banList = document.getElementById('ban-list');
        const pinList = document.getElementById('pin-list');
        const deleteList = document.getElementById('delete-list');
        
        if(banList && pinList && deleteList) {
            let banHTML = ""; let pinHTML = ""; let delHTML = "";
            activeRoster.forEach(p => {
                 const isBanned = data.bannedIndices?.includes(p.id);
                 const banClass = isBanned ? "chip chip-ban is-banned" : "chip chip-ban";
                 const text = isBanned ? `🔓 Desbloquear ${p.name}` : `🚫 Bloquear ${p.name}`;
                 banHTML += `<div class="${banClass}" onclick="window.toggleBan('${p.id}', '${p.name}')">${text}</div>`;
                 
                 if(data.pins && data.pins[p.id]) {
                     pinHTML += `<div class="chip chip-reset" onclick="window.resetPin('${p.id}', '${p.name}')">🔐 Reset ${p.name}</div>`;
                 }
                 delHTML += `<div class="chip chip-ban" style="border-color:black; color:black;" onclick="window.deletePlayerPermanent('${p.id}', '${p.name}')">❌ ${p.name}</div>`;
            });
            banList.innerHTML = banHTML;
            pinList.innerHTML = pinHTML || `<div style="font-size:0.7rem; color:#999;">Sin contraseñas</div>`;
            deleteList.innerHTML = delHTML;
        }

        const myId = localStorage.getItem('futsal_my_id');
        const actionBar = document.getElementById('user-action-bar');
        actionBar.style.display = 'none';
        document.getElementById('user-greeting').style.display = 'none';

        if (myId) {
            const me = activeRoster.find(p => p.id === myId);
            if (me) {
                const greet = document.getElementById('user-greeting');
                greet.innerHTML = `👋 Hola, ${me.name} <span class="reset-id-btn" onclick="window.resetIdentity()">¿NO ERES TÚ?</span>`;
                greet.style.display = 'block';
                selector.style.display = 'none'; 

                if (data.matchDate && !data.teams) {
                    actionBar.style.display = 'flex';
                    const txt = document.getElementById('action-bar-text');
                    const btn = document.getElementById('action-bar-btn');
                    const isSelected = data.selectedPlayers?.includes(myId);
                    const total = (data.selectedPlayers?.length || 0) + (data.selectedGuests?.length || 0);
                    txt.innerHTML = `<span>Tu estado:</span> ${isSelected ? '<span style="color:#22c55e">DENTRO</span>' : '<span style="color:#64748b">FUERA</span>'}`;
                    if (isSelected) {
                        btn.innerText = "❌ BORRARME"; btn.className = "action-bar-btn btn-leave"; btn.disabled = false;
                        btn.onclick = () => window.toggleSelection('player', myId, me.name);
                    } else {
                        if (total >= 18) { btn.innerText = "⛔ COMPLETO"; btn.className = "action-bar-btn btn-full"; btn.disabled = true; } 
                        else { btn.innerText = "✅ APUNTARME"; btn.className = "action-bar-btn btn-join"; btn.disabled = false; btn.onclick = () => window.toggleSelection('player', myId, me.name); }
                    }
                }
            }
        } else {
             if (!data.matchDate) selector.style.display = 'block';
        }

        let playersHTML = "";
        activeRoster.forEach((p) => {
            const isBanned = data.bannedIndices?.includes(p.id);
            if (isBanned) return;

            const isMeClass = (p.id === myId) ? ' is-me' : '';
            const isSelected = data.selectedPlayers?.includes(p.id);
            const pins = data.pins || {};
            const lockIcon = (data.pinMode !== false && pins[p.id]) ? '<span class="lock-icon">🔒</span>' : '';
            let badgeContent = '';
            let selectedClass = '';
            
            if(isSelected) { 
                selectedClass = ' selected'; 
                badgeContent = `<span class="order-badge" style="display:flex;">${data.selectedPlayers.indexOf(p.id) + 1}</span>`; 
            } else {
                badgeContent = `<span class="order-badge"></span>`;
            }
            
            playersHTML += `<div class="player-checkbox${selectedClass}${isMeClass}" onclick="window.toggleSelection('player', '${p.id}', '${p.name}')">
                ${badgeContent} ${p.name} ${lockIcon}
            </div>`;
        });
        container.innerHTML = playersHTML;

        let guestsHTML = "";
        guestsDB.forEach((g) => {
            const isSelected = data.selectedGuests?.includes(g.id);
            const inviter = (data.guestInviters && data.guestInviters[g.id]) ? data.guestInviters[g.id] : null;
            const selectedClass = isSelected ? ' selected' : '';
            let content = `<div class="guest-name"><span class="order-badge" style="${isSelected ? 'display:flex' : ''}">G</span> ${g.name}</div>`;
            if (isSelected && inviter) { content += `<div class="invited-by">↳ por ${inviter}</div>`; }
            
            guestsHTML += `<div class="player-checkbox guest-label${selectedClass}" onclick="window.toggleSelection('guest', '${g.id}', '${g.name}')">${content}</div>`;
        });
        guestContainer.innerHTML = guestsHTML;

        const setupPanel = document.getElementById('setup-panel');
        const activePanel = document.getElementById('active-match-panel');
        const headerDate = document.getElementById('header-date');

        if (!data.matchDate) {
            setupPanel.style.display = 'block'; activePanel.style.display = 'none';
            headerDate.innerText = "PRÓXIMO PARTIDO";
            
            // ⚠️ AQUÍ ESTÁ LA MAGIA PARA VER EL MENSAJE DE CULPABLE ⚠️
            if (data.lastResetMsg) {
               let alertDiv = document.getElementById('reset-alert');
               if (!alertDiv) {
                   alertDiv = document.createElement('div');
                   alertDiv.id = 'reset-alert';
                   alertDiv.style.cssText = "background:#fee2e2; color:#b91c1c; padding:10px; border-radius:8px; margin-bottom:15px; font-size:0.8rem; font-weight:bold;";
                   const dateInput = document.getElementById('date-input');
                   dateInput.parentNode.insertBefore(alertDiv, dateInput);
               }
               alertDiv.innerText = data.lastResetMsg;
            }

        } else {
            setupPanel.style.display = 'none'; activePanel.style.display = 'block';
            const d = new Date(data.matchDate);
            headerDate.innerText = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('res-date').innerText = headerDate.innerText;
        }

        const total = (data.selectedPlayers?.length || 0) + (data.selectedGuests?.length || 0);
        document.getElementById('player-count').innerText = `${total} / 18`;
        const bar = document.getElementById('progress-fill');
        bar.style.width = `${Math.min((total/18)*100, 100)}%`;
        if(total < 8) bar.style.backgroundColor = "#ef4444"; else if (total < 12) bar.style.backgroundColor = "#eab308"; else bar.style.backgroundColor = "#22c55e";

        const pinBtn = document.getElementById('pin-mode-btn');
        if (data.pinMode !== false) { pinBtn.innerText = "🟢 PIN ACTIVADO"; pinBtn.className = "pin-toggle-btn pin-on"; } else { pinBtn.innerText = "🔴 PIN DESACTIVADO"; pinBtn.className = "pin-toggle-btn pin-off"; }
        const voteAdminBtn = document.getElementById('vote-mode-btn');
        if (data.voteMode !== false) { voteAdminBtn.innerText = "🟢 VOTOS ACTIVOS"; voteAdminBtn.className = "pin-toggle-btn pin-on"; } else { voteAdminBtn.innerText = "🔴 VOTOS OFF"; voteAdminBtn.className = "pin-toggle-btn pin-off"; }
        
        const votes = data.unlockVotes ? data.unlockVotes.length : 0;
        const voteBtn = document.getElementById('vote-btn');
        if (!data.teams && total >= 8 && data.voteMode !== false) {
            voteBtn.style.display = 'block'; voteBtn.innerText = `🔓 Solicitar Desbloqueo (${votes}/3)`;
            if(votes >= 3) { voteBtn.style.backgroundColor = "#22c55e"; voteBtn.style.color = "white"; voteBtn.innerText = "✅ Aprobado"; voteBtn.disabled = true; }
        } else voteBtn.style.display = 'none';

        const logDiv = document.getElementById('activity-log');
        if (data.logs && data.logs.length > 0) {
            let logHTML = "";
            [...data.logs].reverse().forEach(logStr => { 
                const parts = logStr.split('|');
                if(parts.length === 2) logHTML += `<div class="log-entry"><span>${parts[0]}</span><span class="log-time">${parts[1]}</span></div>`;
            });
            logDiv.innerHTML = logHTML;
        }

        let teamsData = data.teams;
        if (typeof teamsData === 'string') { try { teamsData = JSON.parse(teamsData); } catch(e){} }

        if (teamsData && teamsData.length > 0) {
            document.getElementById('selection-phase').style.display = 'none';
            document.getElementById('results-phase').style.display = 'block';
            document.getElementById('notify-btn').style.display = 'none';
            if(teamsData.length === 3) document.getElementById('scoreboard').style.display = 'flex'; else document.getElementById('scoreboard').style.display = 'none';
            const sc = data.scores || [0,0,0];
            document.getElementById('sc-blanco').innerText = sc[0];
            document.getElementById('sc-negro').innerText = sc[1];
            document.getElementById('sc-rojo').innerText = sc[2];
            renderTeams(teamsData);
        } else {
            document.getElementById('selection-phase').style.display = 'block';
            document.getElementById('results-phase').style.display = 'none';
            document.getElementById('notify-btn').style.display = 'flex';
            checkTimeLock(data.matchDate, data.lockTime);
        }
    }

    // --- ALGORITMO GREEDY BALANCE ---
    window.triggerGeneration = async (numTeams) => {
        try {
            document.getElementById('loader').style.display = 'flex';
            const roster = currentData.roster || initialPlayers;
            const pool = [];
            (currentData.selectedPlayers || []).forEach(id => {
                const p = roster.find(x => x.id === id);
                if(p) { const jitter = (Math.random() * 0.5) - 0.25; pool.push({ ...p, isGuest: false, sortLevel: p.level + jitter }); }
            });
            (currentData.selectedGuests || []).forEach(id => {
                const g = guestsDB.find(x => x.id === id);
                if(g) { const jitter = (Math.random() * 0.5) - 0.25; const baseLevel = g.level || 1.5; pool.push({ ...g, level: baseLevel, isGuest: true, sortLevel: baseLevel + jitter }); }
            });
            pool.sort((a, b) => b.sortLevel - a.sortLevel);
            let teams = Array.from({ length: numTeams }, () => ({ players: [], totalScore: 0 }));
            pool.forEach(player => {
                teams.sort((a, b) => { if (a.players.length !== b.players.length) return a.players.length - b.players.length; return a.totalScore - b.totalScore; });
                teams[0].players.push(player); teams[0].totalScore += player.level;
            });
            const finalTeams = teams.map(t => t.players);
            finalTeams.forEach(team => window.shuffle(team));
            const teamsString = JSON.stringify(finalTeams);
            const myId = localStorage.getItem('futsal_my_id');
            const author = currentData.roster?.find(p=>p.id===myId)?.name || "Sistema";
            const now = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            await updateDoc(matchRef, { teams: teamsString, logs: arrayUnion(`⚽ Equipos equilibrados creados por ${author}|${now}`) });
            document.getElementById('loader').style.display = 'none';
        } catch (e) { console.error(e); document.getElementById('loader').style.display = 'none'; window.showToast("Error generando equipos: " + e.message, "error"); }
    };

    // --- AUTH LOGIN TRIGGER ---
    let taps = 0;
    let tapTimer = null;
    window.secretAdminTap = () => {
        taps++; 
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => taps = 0, 2000);
        if(taps === 5) {
            if (auth.currentUser) {
                document.getElementById('admin-zone').style.display = 'block';
                window.showToast("Sesión recuperada", "success");
            } else {
                window.showLoginModal();
            }
            taps = 0;
        }
    };
    window.hideAdmin = () => document.getElementById('admin-zone').style.display = 'none';

    // --- START NEW MATCH ---
    window.startNewMatch = async () => {
        const myId = localStorage.getItem('futsal_my_id');
        const selectedId = document.getElementById('identity-select').value;
        if (!myId && !selectedId) return window.showToast("⚠️ Debes decirme quién eres primero", "error");
        if (selectedId) localStorage.setItem('futsal_my_id', selectedId);

        const dateInput = document.getElementById('date-input').value;
        if (!dateInput) return window.showToast("Selecciona fecha", "error");
        
        // Protección sobrescritura
        if (currentData.matchDate && currentData.matchDate === dateInput) {
            return window.showToast("⚠️ Ya existe un partido para esta fecha.", "error");
        }

        const selected = new Date(dateInput);
        const today = new Date(); today.setHours(0,0,0,0);
        if(selected < today) return window.showToast("Día pasado no válido", "error");
        
        showConfirm("¿Abrir convocatoria?", `Fecha: ${dateInput}`, async () => {
             const now = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
             const finalId = localStorage.getItem('futsal_my_id');
             const author = currentData.roster?.find(p=>p.id===finalId)?.name || "Alguien";

             window.showToast("Procesando...", "info");

             // Auto-archivado
             if(currentData.matchDate && currentData.teams && currentData.teams.length > 0) {
                 try {
                    await addDoc(collection(db, "history"), { 
                        date: currentData.matchDate, 
                        teams: currentData.teams, 
                        scores: currentData.scores || [0,0,0] 
                    });
                 } catch(e) { console.error(e); }
             }

             window.shareConvocation(dateInput);

             const nextPinMode = (currentData.pinMode !== undefined) ? currentData.pinMode : true;

             await setDoc(matchRef, { 
                matchDate: dateInput, 
                lockTime: currentData.lockTime || "18:00", 
                pinMode: nextPinMode,
                voteMode: currentData.voteMode !== false,
                selectedPlayers: [], selectedGuests: [], guestInviters: {}, 
                scores: [0,0,0], timerState: 'stopped', timerLeft: 300,
                teams: null, 
                logs: [`📅 Convocatoria abierta por ${author}|${now}`], 
                pins: currentData.pins || {}, 
                unlockVotes: [], 
                roster: currentData.roster || initialPlayers,
                lastResetMsg: null // Borrar mensaje de error anterior
            }, { merge: true });
        });
    };
    
    // --- TIMERS Y LIMPIEZA AUTOMÁTICA INTELIGENTE (CHIVATO + PERMISIVO PARA PRUEBAS) ---
    setInterval(async () => {
        if (currentData.matchDate) { 
            checkTimeLock(currentData.matchDate, currentData.lockTime); 
            
            const matchDate = new Date(currentData.matchDate);
            const now = new Date();
            
            // Umbral: Día siguiente a las 06:00 AM
            const safetyResetTime = new Date(matchDate);
            safetyResetTime.setDate(safetyResetTime.getDate() + 1); 
            safetyResetTime.setHours(6, 0, 0, 0); 
            
            if (now >= safetyResetTime) {
                // 1. IDENTIFICAR AL SUJETO
                const myId = localStorage.getItem('futsal_my_id');
                const roster = currentData.roster || initialPlayers;
                const me = roster.find(p => p.id === myId);
                
                // Detectar tipo de dispositivo
                let deviceType = "PC/Desconocido";
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) deviceType = "iPhone";
                else if (/Android/i.test(navigator.userAgent)) deviceType = "Android";
                
                let culpritName = me ? me.name : `Anónimo (${deviceType})`;

                // 2. REGLA DEL PORTERO (DESACTIVADA PARA QUE PUEDAS PROBAR EL ERROR)
                /* if (!me && !auth.currentUser) {
                    console.log("Protección activada: Anónimo bloqueado.");
                    return; 
                } 
                */

                console.log("Limpieza ejecutada por:", culpritName);
                
                // 3. EJECUTAR LIMPIEZA
                if(currentData.teams) {
                    await addDoc(collection(db, "history"), { 
                        date: currentData.matchDate, 
                        teams: currentData.teams, 
                        scores: currentData.scores,
                        resetBy: culpritName 
                    });
                }
                
                updateDoc(matchRef, { 
                    matchDate: null, 
                    selectedPlayers: [], 
                    teams: null,
                    logs: [],
                    lastResetMsg: `⚠️ El último partido fue cerrado automáticamente por: ${culpritName}`
                }); 
            } 
        }
        
        if(currentData.timerState === 'running') {
            const display = document.getElementById('timer-display'); const btn = document.getElementById('timer-start-btn'); const txt = document.getElementById('timer-status-text');
            const left = Math.max(0, Math.ceil((currentData.timerEnd - Date.now()) / 1000));
            const m = Math.floor(left / 60).toString().padStart(2, '0'); const s = (left % 60).toString().padStart(2, '0'); display.innerText = `${m}:${s}`; btn.innerText = "⏸ PAUSA"; btn.classList.add('t-stop');
            if(left <= 60 && left > 0) { display.classList.add('last-minute'); txt.innerText = "¡ÚLTIMO MINUTO!"; } else if(left <= 0) { display.classList.remove('last-minute'); display.classList.add('finished'); display.innerText = "ÚLTIMA JUGADA"; txt.innerText = "TIEMPO CUMPLIDO"; btn.innerText = "FIN"; if(!hasBeeped) { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); osc.connect(ctx.destination); osc.start(); setTimeout(()=>osc.stop(), 1000); hasBeeped = true; } }
        }
    }, 1000);

    // ... (Resto de funciones igual) ...
    window.toggleTimer = async () => { if (currentData.timerState === 'running') { const left = Math.max(0, Math.floor((currentData.timerEnd - Date.now()) / 1000)); await updateDoc(matchRef, { timerState: 'paused', timerLeft: left }); } else { const target = Date.now() + (currentData.timerLeft * 1000); await updateDoc(matchRef, { timerState: 'running', timerEnd: target }); } };
    window.resetTimer = async () => { await updateDoc(matchRef, { timerState: 'stopped', timerLeft: 300 }); hasBeeped = false; document.getElementById('timer-display').classList.remove('finished', 'last-minute'); document.getElementById('timer-display').innerText = "05:00"; };
    window.updateScore = async (idx, delta) => { let s = [...(currentData.scores || [0,0,0])]; s[idx] = Math.max(0, s[idx] + delta); await updateDoc(matchRef, { scores: s }); };
    
    let defPrompt; window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); defPrompt = e; });
    window.installApp = async () => { if(defPrompt) { defPrompt.prompt(); defPrompt = null; } else window.showToast("Usa menú navegador -> Instalar", "info"); };

    function checkTimeLock(dateStr, lockTimeStr) {
        const btn = document.getElementById('btn-create');
        const msg = document.getElementById('time-lock-msg');
        const now = new Date();
        const target = new Date(dateStr);
        const [h, m] = (lockTimeStr || "18:00").split(':');
        target.setHours(h, m, 0, 0);
        
        const votes = currentData.unlockVotes ? currentData.unlockVotes.length : 0;
        const canUnlock = (currentData.voteMode !== false && votes >= 3);
        
        btn.removeAttribute('disabled');

        if (now >= target || canUnlock) {
            btn.className = "action-btn btn-unlocked";
            btn.innerHTML = "⚽ CREAR EQUIPOS";
            msg.innerText = "";
        } else {
            btn.className = "action-btn btn-locked";
            btn.innerHTML = "🔒 CREAR EQUIPOS";
            msg.innerText = `Disponible a las ${lockTimeStr} (o con 3 votos)`;
        }
        
        const cd = document.getElementById('countdown-display');
        if(now < target) {
            const diff = target - now;
            const hh = Math.floor(diff/(1000*60*60));
            const mm = Math.floor((diff%(1000*60*60))/(1000*60));
            const ss = Math.floor((diff%(1000*60))/1000);
            cd.innerText = `Cierre en: ${hh}h ${mm}m ${ss}s`;
        } else cd.innerText = "Cierre alcanzado";
    }
</script>
